version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: cron
      cronjob: "23 4 * * 1"
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
    ignore:
      # @types/node major must match the node.js version from engines.node
      - dependency-name: "@types/node"
        update-types:
          - version-update:semver-major
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: cron
      cronjob: "37 4 * * 1"
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
